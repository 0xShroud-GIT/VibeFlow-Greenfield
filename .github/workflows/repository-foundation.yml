name: Repository Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify dev-environment verification depth
        id: devscope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_dev_image=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            if changed="$(git diff --name-only "$BASE_SHA"...HEAD)"; then
              run_dev_image=false
              if printf '%s\n' "$changed" | grep -Eq '^(\.devcontainer/|infrastructure/dev/|scripts/dev-|scripts/validate-m007-local-dev\.py$|scripts/_validate_m007_core\.py$|tests/contract/test_m007_local_dev\.py$|\.nvmrc$|\.npmrc$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/workflows/)'; then
                run_dev_image=true
              fi
            fi
          fi
          echo "run_dev_image=$run_dev_image" >> "$GITHUB_OUTPUT"
          echo "Dev-image runtime verification: $run_dev_image"
      - name: Setup Node 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Enable corepack
        shell: bash
        run: corepack enable
      - name: Verify Node and pnpm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.4.0"
      - name: Install dependencies (frozen lockfile)
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Run foundation check
        shell: bash
        run: pnpm run check
      - name: Pull exact dev container base image by digest
        if: ${{ steps.devscope.outputs.run_dev_image == 'true' }}
        shell: bash
        run: docker pull docker.io/library/node:24.19.0-trixie-slim@sha256:0711b541c1c33a8a530ac4f0d391baa9a15b3d804695b1b24a47daa5fb60e74d
      - name: Build dev container and run runtime smoke inside the exact image
        if: ${{ steps.devscope.outputs.run_dev_image == 'true' }}
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: vibeflow-dev
          runCmd: python3 scripts/dev-runtime-smoke.py
          push: never
