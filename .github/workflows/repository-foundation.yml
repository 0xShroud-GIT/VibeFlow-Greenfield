name: Repository Foundation

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.npmrc'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - 'packages/**'
      - 'apps/**'
      - 'services/**'
      - 'workers/**'
      - 'adapters/**'
      - 'scripts/validate-m004-foundation.py'
      - 'tests/contract/test_m004_foundation.py'
      - '.github/workflows/repository-foundation.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - '.npmrc'
      - 'tsconfig.base.json'
      - 'turbo.json'
      - 'packages/**'
      - 'apps/**'
      - 'services/**'
      - 'workers/**'
      - 'adapters/**'
      - 'scripts/validate-m004-foundation.py'
      - 'tests/contract/test_m004_foundation.py'
      - '.github/workflows/repository-foundation.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Enable corepack
        shell: bash
        run: corepack enable
      - name: Verify Node and pnpm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.4.0"
      - name: Install dependencies (frozen lockfile)
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Run foundation check
        shell: bash
        run: pnpm run check
