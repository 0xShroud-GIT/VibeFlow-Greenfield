name: Repository Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Enable corepack
        shell: bash
        run: corepack enable
      - name: Verify Node and pnpm versions
        shell: bash
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(pnpm --version)" = "11.4.0"
      - name: Install dependencies (frozen lockfile)
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Run foundation check
        shell: bash
        run: pnpm run check
      - name: Pull exact dev container base image by digest
        shell: bash
        run: docker pull docker.io/library/node@sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584
      - name: Build dev container and run runtime smoke inside the exact image
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: vibeflow-dev
          runCmd: python3 scripts/dev-runtime-smoke.py
          push: never
