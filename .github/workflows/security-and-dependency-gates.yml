name: Security & Dependency Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Enable exact pnpm
        shell: bash
        run: corepack enable
      - name: Validate static security and dependency policy
        shell: bash
        run: pnpm run security:validate

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: python3 scripts/security/install-ci-tool.py gitleaks
      - name: Test exact Gitleaks binary with positive and negative fixtures
        shell: bash
        run: scripts/security/test-gitleaks.sh
      - name: Scan full repository history with redaction
        shell: bash
        run: scripts/security/run-gitleaks.sh

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified vulnerability scanners
        shell: bash
        run: |
          python3 scripts/security/install-ci-tool.py osv-scanner
          python3 scripts/security/install-ci-tool.py trivy
      - name: Scan resolved lockfile state with OSV-Scanner
        shell: bash
        run: scripts/security/run-osv-scanner.sh
      - name: Scan repository vulnerabilities and misconfigurations with Trivy
        shell: bash
        run: scripts/security/run-trivy.sh
      - name: Classify dev-image security verification depth
        id: devscope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_dev_image=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            if changed="$(git diff --name-only "$BASE_SHA"...HEAD)"; then
              run_dev_image=false
              if printf '%s\n' "$changed" | grep -Eq '^(\.devcontainer/|infrastructure/dev/|scripts/dev-|scripts/validate-m007-local-dev\.py$|scripts/_validate_m007_core\.py$|scripts/security/(scan-dev-image|generate-dev-image-sbom)\.sh$|security/|tests/contract/test_m007_local_dev\.py$|\.github/workflows/)'; then
                run_dev_image=true
              fi
            fi
          fi
          echo "run_dev_image=$run_dev_image" >> "$GITHUB_OUTPUT"
          echo "Dev-image security verification: $run_dev_image"
      - name: Pull exact dev container base image by digest
        if: ${{ steps.devscope.outputs.run_dev_image == 'true' }}
        shell: bash
        run: docker pull docker.io/library/node:24.19.0-trixie-slim@sha256:0711b541c1c33a8a530ac4f0d391baa9a15b3d804695b1b24a47daa5fb60e74d
      - name: Build exact dev container image
        if: ${{ steps.devscope.outputs.run_dev_image == 'true' }}
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: vibeflow-dev
          push: never
      - name: Scan exact dev image with Trivy
        if: ${{ steps.devscope.outputs.run_dev_image == 'true' }}
        env:
          DEV_IMAGE: vibeflow-dev:latest
        shell: bash
        run: scripts/security/scan-dev-image.sh
      - name: Generate ephemeral CycloneDX dev-image SBOM
        if: ${{ steps.devscope.outputs.run_dev_image == 'true' }}
        env:
          DEV_IMAGE: vibeflow-dev:latest
        shell: bash
        run: scripts/security/generate-dev-image-sbom.sh "$RUNNER_TEMP/vibeflow-dev-image.cdx.json"
      - name: Upload ephemeral dev-image CycloneDX evidence
        if: ${{ steps.devscope.outputs.run_dev_image == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibeflow-dev-image-cyclonedx
          path: |
            ${{ runner.temp }}/vibeflow-dev-image.cdx.json
            ${{ runner.temp }}/vibeflow-dev-image.cdx.json.sha256
          if-no-files-found: error
          retention-days: 7

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test repository-owned Semgrep rules
        shell: bash
        run: scripts/security/test-semgrep-rules.sh
      - name: Run digest-pinned Semgrep CE with local rules
        shell: bash
        run: scripts/security/run-semgrep.sh

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified Trivy
        shell: bash
        run: python3 scripts/security/install-ci-tool.py trivy
      - name: Generate ephemeral CycloneDX repository SBOM
        shell: bash
        run: scripts/security/generate-sbom.sh "$RUNNER_TEMP/vibeflow-repository.cdx.json"
      - name: Upload ephemeral CycloneDX evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibeflow-repository-cyclonedx
          path: |
            ${{ runner.temp }}/vibeflow-repository.cdx.json
            ${{ runner.temp }}/vibeflow-repository.cdx.json.sha256
          if-no-files-found: error
          retention-days: 7

  security-gate:
    if: always()
    needs: [dependency-policy, secrets, vulnerabilities, sast, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every security gate to succeed
        shell: bash
        run: |
          test "${{ needs.dependency-policy.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"
          test "${{ needs.vulnerabilities.result }}" = "success"
          test "${{ needs.sast.result }}" = "success"
          test "${{ needs.sbom.result }}" = "success"
