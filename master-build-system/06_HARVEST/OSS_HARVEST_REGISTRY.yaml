  use: Primary BYOW workspace provider (sandbox compute behind an adapter).
  ownership: Daytona operates sandboxes as an external provider; VibeFlow retains WorkspaceBinding authority, capability certification and reconciliation.
  upgrade_policy: API-level integration only; re-certify the operated service per Phase 11 (OSS repository frozen June 2026).
  replacement_strategy: E2B or user BYOW behind the same WorkspaceProvider interface.
- id: H-017
  capability: workspace_provider
