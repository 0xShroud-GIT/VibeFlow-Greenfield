  use: Default BYOA-compatible coding-agent adapter and reference implementation.
  ownership: OpenHands SDK is an adapter/reference only, never core authority; VibeFlow owns remote authority/recovery/verification semantics.
  upgrade_policy: Track the current 1.x reference line at the Phase-9 adapter mission; re-certify capabilities on upgrades.
