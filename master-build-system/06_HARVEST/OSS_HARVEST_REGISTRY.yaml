  use: Secondary workspace/sandbox provider adapter.
  ownership: E2B operates sandboxes; VibeFlow retains WorkspaceBinding authority; persistence semantics must not be assumed equivalent.
  upgrade_policy: Stay near the current 2.x SDK line at the Phase-11 mission; re-certify on SDK majors.
