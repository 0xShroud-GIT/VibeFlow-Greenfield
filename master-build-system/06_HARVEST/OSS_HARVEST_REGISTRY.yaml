as_of: '2026-08-17'
policy: This registry records ratified technology choices, package coordinates, version lines, license classifications and explicit
  install/build-script approvals. Exact installable package versions are pinned in the repository lockfile starting with Mission 004;
  package install/build scripts are denied unless a per-package approval with exact version, explicit pnpm matcher and rationale is recorded here.
install_build_script_policy:
  default: deny
  approvals: []
entries:
- id: H-001
  capability: runtime
  name: Node.js
  version: 24.18.x LTS
  decision: ADOPT
  integration: DEPEND
  license: MIT
  source: https://nodejs.org/en/about/previous-releases
  rule: Use LTS, not Current, for control-plane production.
  use: JS runtime for all VibeFlow TypeScript services and workers.
  ownership: Node.js owns the runtime process/V8; VibeFlow owns application code, lifecycle and deployment.
  upgrade_policy: Stay on the active LTS line (24.x); minors/security releases via lockfile refresh from M-004; next LTS via migration mission.
  replacement_strategy: Foundational runtime with no drop-in substitute; control via pinned container image and engines field.
- id: H-002
  capability: language
  name: TypeScript
  version: 6.0.3
  decision: ADOPT
  integration: DEPEND
  license: Apache-2.0
  source: https://github.com/microsoft/TypeScript
  package_coordinates:
  - ecosystem: npm
    name: typescript
    harvest_id: H-002
    approved_usage: development
  rule: Strict mode. Avoid type-any escape hatches in contracts.
  use: Language and static type checking for all VibeFlow code.
  ownership: TypeScript owns the compiler/language; VibeFlow owns its types, contracts and strict-mode policy.
  upgrade_policy: Follow stable minors; major versions via explicit toolchain mission.
  replacement_strategy: Compiler-only toolchain dependency; product code has no runtime coupling.
- id: H-003
  capability: package_manager
  name: pnpm
  version: 11.4.x
  decision: ADOPT
  integration: DEPEND
  license: MIT
  source: https://github.com/pnpm/pnpm
  rule: Single workspace lockfile.
  use: Package installation and the single workspace lockfile (from M-004).
  ownership: pnpm owns dependency resolution/install; VibeFlow owns dependency policy and CI gates.
  upgrade_policy: Stay on 11.x stable; major versions via toolchain mission.
  replacement_strategy: Any workspace-capable package manager behind standard package.json manifests.
- id: H-004
  capability: monorepo_build
  name: Turborepo
  version: 2.10.x stable
  decision: ADOPT
  integration: DEPEND
  license: MIT
  source: https://github.com/vercel/turborepo
  package_coordinates:
  - ecosystem: npm
    name: turbo
    harvest_id: H-004
    approved_usage: development
  rule: Build/test caching only; architecture does not depend on Turborepo.
  use: Monorepo build/test task graph and caching only.
  ownership: Turborepo owns task scheduling/caching; VibeFlow owns build definitions; architecture must not depend on Turborepo.
  upgrade_policy: Stay on 2.10.x stable; removal must stay possible without architecture change.
  replacement_strategy: Remove turbo and run package scripts directly (pnpm -r or equivalent); caching is optional.
- id: H-005
  capability: mobile
  name: Expo
  version: SDK 56 stable
  decision: ADOPT
  integration: DEPEND
  license: MIT
  source: https://expo.dev/changelog
  rule: Expo Router and EAS where useful; custom native modules only for real gaps.
  use: Mobile app framework, native modules and build tooling (EAS where useful).
  ownership: Expo owns mobile tooling/native modules; VibeFlow owns mobile control UX and the native-web bridge.
  upgrade_policy: Follow Expo SDK releases via mobile migration missions; custom native modules only for real gaps.
  replacement_strategy: Eject to bare React Native retaining application code; tooling-only coupling.
- id: H-006
  capability: mobile_runtime
  name: React Native
  version: 0.85.x stable line
  decision: ADOPT
  integration: DEPEND
  license: MIT
  source: https://github.com/facebook/react-native
  rule: Follow Expo-compatible RN version.
  use: Native mobile rendering runtime for the control app.
  ownership: React Native owns native rendering; VibeFlow owns product state and navigation policy.
  upgrade_policy: Follow the Expo-SDK-compatible RN line (0.85.x).
  replacement_strategy: Version pinned by Expo SDK choice; workspace-web remains the full fallback surface.
- id: H-007
  capability: web_editor
  name: Monaco Editor
  version: 0.56.x
  decision: ADOPT
  integration: DEPEND
  license: MIT
  source: https://github.com/microsoft/monaco-editor
  rule: VibeFlow owns project/revision/session integration, not text editor internals.
  use: Workspace-web code editor surface.
  ownership: Monaco owns text editing internals; VibeFlow owns project/revision/session integration, permissions and mobile bridge integration.
  upgrade_policy: Stay on 0.56.x; upgrades gated by editor regression suites.
  replacement_strategy: Alternative browser editor (e.g. CodeMirror) behind the editor panel interface.
- id: H-008
  capability: web_terminal
  name: xterm.js
  version: 6.0.x
  decision: ADOPT
  integration: DEPEND
  license: MIT
  source: https://github.com/xtermjs/xterm.js
  rule: VibeFlow owns TerminalSession authority and transport, not terminal emulation. Use the official @xterm/*
    scoped npm packages (legacy xterm/xterm-* names are deprecated upstream).
  use: Workspace-web terminal front-end (user-facing PTY rendering).
  ownership: xterm.js owns terminal emulation/rendering; VibeFlow owns TerminalSession authority, workspace binding, transport, policy and evidence.
  upgrade_policy: Stay on 6.0.x via @xterm/* scoped packages from M-004.
  replacement_strategy: Alternative terminal emulator behind the TerminalTransport interface.
- id: H-009
  capability: api_server
  name: Fastify
  version: 5.10.x
  decision: ADOPT
  integration: DEPEND
  license: MIT
  source: https://github.com/fastify/fastify
  rule: Start as modular control-plane service; avoid early microservices.
  use: Modular control-plane HTTP API service.
  ownership: Fastify owns HTTP plumbing/plugin lifecycle; VibeFlow owns API contracts, authorization and state semantics.
  upgrade_policy: Stay on 5.x; apply security patches promptly.
  replacement_strategy: Route handlers stay framework-portable; swap HTTP framework behind the server bootstrap.
- id: H-010
  capability: database
  name: PostgreSQL
  version: 18.x
  decision: ADOPT
  integration: SERVICE
  license: PostgreSQL
  source: https://www.postgresql.org/docs/18/
  rule: Authoritative control-plane database.
  use: Authoritative control-plane database service.
  ownership: PostgreSQL owns storage/engine; VibeFlow owns schema and authority semantics.
  upgrade_policy: Stay on 18.x minors; major upgrades via migration mission with backup/restore evidence.
  replacement_strategy: SQL engine behind Drizzle SQL migrations; switchable to managed PostgreSQL providers.
- id: H-011
  capability: orm_migrations
  name: Drizzle ORM + Kit
  version: 0.45.2 stable
  decision: ADOPT
  integration: DEPEND
  license: Apache-2.0
  source: https://github.com/drizzle-team/drizzle-orm
  package_coordinates:
  - ecosystem: npm
    name: drizzle-orm
    harvest_id: H-011
    approved_usage: production
  - ecosystem: npm
    name: pg
    harvest_id: H-011
    approved_usage: production
  - ecosystem: npm
    name: '@types/pg'
    harvest_id: H-011
    approved_usage: development
  rule: Use SQL migrations committed to repo; do not use RC line without explicit upgrade
    mission. Exact M-008 pins are drizzle-orm 0.45.2, pg 8.23.0 (official
    drizzle-orm@0.45.2 node-postgres peer), and @types/pg 8.23.1. drizzle-kit is
    not installed in this mission because its esbuild install/build scripts are
    deny-by-default and no 0.45.2 kit release exists; committed SQL is the
    migration authority. postgres.js is not selected because Unlicense is
    outside the green license token set.
  use: Type-safe query building and SQL migration kit.
  ownership: Drizzle owns query building/migration mechanics; VibeFlow owns the schema and migration policy (SQL committed to repo).
  upgrade_policy: Stay on 0.45.2 stable; 1.0 line only via explicit upgrade mission (RC excluded).
  replacement_strategy: Plain SQL migrations already canonical; migration runner is replaceable.
- id: H-012
  capability: authentication
  name: Better Auth
  version: 1.6.x stable
  decision: ADOPT
  integration: WRAP
  license: MIT
  source: https://github.com/better-auth/better-auth
  package_coordinates:
  - ecosystem: npm
    name: better-auth
    harvest_id: H-012
    approved_usage: production
    version: 1.6.30
    license: MIT
    source: https://github.com/better-auth/better-auth
  - ecosystem: npm
    name: kysely
    harvest_id: H-012
    approved_usage: production
    version: 0.29.5
    license: MIT
    source: https://github.com/kysely-org/kysely
  rule: Wrap behind Identity module; enterprise SAML/SCIM may later use dedicated provider. M-009 pins better-auth 1.6.30, the current stable release within the ratified 1.6.x line, and its 0.29.5 Kysely PostgreSQL transaction dependency to preserve signup atomicity.
  use: Commodity authentication/session mechanics behind the VibeFlow Identity module.
  ownership: Better Auth supplies auth protocols/sessions; VibeFlow owns product identity linking and tenant/project authorization; never VibeFlow authority.
  upgrade_policy: Stay on 1.6.x stable; breaking changes via identity mission.
  replacement_strategy: Another auth library/IdP behind the Identity module interface; enterprise SAML/SCIM via dedicated provider later.
- id: H-013
  capability: authorization
  name: OpenFGA
  version: 1.18.x
  decision: ADOPT_LATER
  integration: SERVICE
  license: Apache-2.0
  source: https://github.com/openfga/openfga
  rule: Use when relationship authorization complexity exceeds local policy tables; do not introduce in Phase 1 by default.
  use: Relationship-based authorization evaluation once complexity exceeds local policy tables (not Phase 1).
  ownership: OpenFGA evaluates relationship tuples; VibeFlow owns grants, policy and approval semantics.
  upgrade_policy: ADOPT_LATER; adopt at 1.18.x+ only with an authorization mission.
  replacement_strategy: Local policy tables remain the default path; OpenFGA is an add-on evaluator.
- id: H-014
  capability: durable_workflows
  name: Temporal TypeScript SDK
  version: 1.21.x
  decision: ADOPT
  integration: DEPEND_SERVICE
  license: MIT
  source: https://github.com/temporalio/sdk-typescript
  rule: Temporal supplies durable workflow mechanics; VibeFlow owns Task/Execution domain semantics.
  use: Durable workflow engine mechanics for long-running Task/Execution orchestration.
  ownership: Temporal supplies durable execution/retries/timers; VibeFlow owns Task/Execution/Recovery domain semantics.
  upgrade_policy: Stay on 1.21.x SDK; server versions per Temporal support matrix.
  replacement_strategy: ExecutionRunner abstraction isolates the engine; DB-backed durable queue is the small-scale fallback.
- id: H-015
  capability: coding_agent
  name: OpenHands Software Agent SDK
  version: 1.x current stable reference line (v1.42.1 verified 2026-08-17; supersedes the 1.24.x research anchor)
  decision: ADOPT_AS_DEFAULT_ADAPTER
  integration: SERVICE_ADAPTER
  license: MIT
  source: https://github.com/OpenHands/software-agent-sdk
  rule: Default BYOA-compatible adapter/reference, never core authority. MIT applies to the SDK repo; the OpenHands
